<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a13">
<title>exif-mcp — Metadata Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial' font-weight='800' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #070a13;
    --text: #eef2f8;
    --muted: #8b96ab;
    --faint: #5b6478;
    --glass: rgba(255, 255, 255, 0.045);
    --glass-2: rgba(255, 255, 255, 0.07);
    --stroke: rgba(255, 255, 255, 0.09);
    --indigo: #6366f1;
    --violet: #a855f7;
    --cyan: #22d3ee;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --grad: linear-gradient(135deg, #6366f1, #a855f7 55%, #22d3ee);
    --grad-soft: linear-gradient(135deg, rgba(99,102,241,.18), rgba(168,85,247,.14));
    --radius: 18px;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* Animated background */
  .bgfx { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .bgfx::before, .bgfx::after {
    content: ""; position: absolute; border-radius: 50%;
    filter: blur(90px); opacity: .35;
  }
  .bgfx::before {
    width: 560px; height: 560px;
    background: #4f46e5; top: -180px; right: -120px;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .bgfx::after {
    width: 480px; height: 480px;
    background: #0e7490; bottom: -180px; left: -120px;
    animation: drift 22s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(-60px,40px) scale(1.15); } }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 99px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Layout ---------- */
  .app { min-height: 100dvh; }
  .content { max-width: 1120px; margin: 0 auto; padding: 20px 22px calc(120px + var(--safe-bottom)); }
  @media (min-width: 901px) {
    .content { padding: 26px 30px 60px; }
  }

  header {
    position: sticky; top: 0; z-index: 40;
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    background: rgba(7,10,19,.72);
    border-bottom: 1px solid var(--stroke);
  }
  .header-in { max-width: 1120px; margin: 0 auto; padding: 14px 22px; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 38px; height: 38px; flex-shrink: 0;
    background: var(--grad);
    border-radius: 12px;
    display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 19px;
    box-shadow: 0 6px 20px rgba(99,102,241,.4);
  }
  .brand .title { font-size: 16px; font-weight: 700; letter-spacing: .2px; }
  .brand .sub { font-size: 11.5px; color: var(--muted); }
  .header-in .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .pill {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted);
    background: var(--glass); border: 1px solid var(--stroke);
    padding: 6px 12px; border-radius: 99px;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
  .pill.on .dot { background: var(--green); box-shadow: 0 0 10px rgba(52,211,153,.8); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }

  /* ---------- Nav (desktop sidebar / mobile bottom bar) ---------- */
  .desktop-nav {
    position: fixed; left: 22px; top: 50%; transform: translateY(-50%);
    z-index: 30;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: 18px;
    padding: 10px;
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    width: 74px;
    padding: 12px 8px;
    border: none; border-radius: 13px;
    background: transparent; color: var(--muted);
    font-size: 11px; font-weight: 600;
    cursor: pointer;
    transition: background .18s, color .18s, transform .18s;
  }
  .nav-btn svg { width: 22px; height: 22px; stroke-width: 1.8; }
  .nav-btn:hover { color: var(--text); transform: translateY(-1px); }
  .nav-btn.active {
    background: var(--grad-soft);
    color: #fff;
    box-shadow: inset 0 0 0 1px rgba(139,92,246,.35);
  }
  .nav-btn .cnt {
    font-size: 9.5px; background: rgba(255,255,255,.12);
    padding: 1px 6px; border-radius: 99px;
  }
  @media (max-width: 900px) {
    .desktop-nav { display: none; }
  }

  .mobile-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex;
    padding: 10px 12px calc(10px + var(--safe-bottom));
    gap: 8px;
    background: rgba(10,14,24,.82);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-top: 1px solid var(--stroke);
  }
  .mobile-nav .nav-btn { flex: 1; flex-direction: row; justify-content: center; gap: 7px; width: auto; padding: 12px 6px; font-size: 12px; }
  .mobile-nav .nav-btn svg { width: 19px; height: 19px; }
  @media (min-width: 901px) {
    .mobile-nav { display: none; }
  }

  /* ---------- Cards ---------- */
  .card {
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: var(--radius);
    padding: 20px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 14px 40px rgba(0,0,0,.25);
    margin-bottom: 16px;
    animation: rise .35s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .card-h {
    display: flex; align-items: center; gap: 9px;
    font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1.4px;
    margin-bottom: 14px;
  }
  .card-h svg { width: 16px; height: 16px; stroke: var(--indigo); }
  .card-h .ln { flex: 1; height: 1px; background: linear-gradient(90deg, var(--stroke), transparent); }

  /* ---------- Source ---------- */
  .dropzone {
    border: 2px dashed rgba(139,150,171,.35);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .18s, background .18s, transform .18s;
    position: relative;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--indigo);
    background: rgba(99,102,241,.08);
    transform: translateY(-1px);
  }
  .dz-ico {
    width: 58px; height: 58px; margin: 0 auto 12px;
    border-radius: 18px;
    background: var(--grad-soft);
    border: 1px solid rgba(139,92,246,.3);
    display: grid; place-items: center;
  }
  .dz-ico svg { width: 28px; height: 28px; stroke: #c4b5fd; }
  .dropzone .big { font-size: 15px; color: var(--text); font-weight: 600; margin-bottom: 3px; }
  .dropzone .hint { font-size: 12.5px; }
  .dropzone input[type=file] { display: none; }
  .url-row { display: flex; gap: 10px; margin-top: 14px; }
  .url-row input[type=text] {
    flex: 1;
    background: var(--glass-2);
    border: 1px solid var(--stroke);
    color: var(--text);
    border-radius: 13px;
    padding: 12px 15px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .url-row input[type=text]:focus { border-color: var(--indigo); }

  button.btn {
    background: var(--grad);
    color: #fff;
    border: none;
    border-radius: 13px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    box-shadow: 0 8px 24px rgba(99,102,241,.35);
    transition: transform .12s, box-shadow .12s, opacity .15s;
  }
  button.btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(99,102,241,.45); }
  button.btn:active { transform: translateY(0); }
  button.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
  button.btn.ghost { background: var(--glass-2); border: 1px solid var(--stroke); box-shadow: none; color: var(--text); }
  button.btn.ghost:hover { background: rgba(255,255,255,.1); box-shadow: none; }
  button.btn.danger { background: linear-gradient(135deg, #ef4444, #f97316); box-shadow: 0 8px 24px rgba(239,68,68,.3); }
  button.btn.success { background: linear-gradient(135deg, #10b981, #06b6d4); box-shadow: 0 8px 24px rgba(16,185,129,.3); }

  /* ---------- Filmstrip ---------- */
  .filmstrip { display: flex; gap: 12px; margin-top: 16px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x mandatory; }
  .frame {
    position: relative;
    flex: 0 0 74px;
    height: 74px;
    border-radius: 15px;
    border: 2px solid var(--stroke);
    overflow: hidden;
    cursor: pointer;
    scroll-snap-align: start;
    transition: border-color .15s, transform .15s;
  }
  .frame:hover { transform: translateY(-2px); }
  .frame.sel { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(99,102,241,.3); }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
  .frame .badge {
    position: absolute; left: 3px; bottom: 3px;
    font-size: 8.5px; color: #fff; font-weight: 700;
    background: rgba(0,0,0,.6); padding: 1px 5px; border-radius: 5px;
    text-transform: uppercase;
  }
  .frame .x {
    position: absolute; top: 3px; right: 3px;
    width: 19px; height: 19px;
    background: rgba(0,0,0,.7); color: #fff;
    border: none; border-radius: 7px;
    font-size: 12px; line-height: 1;
    display: none; cursor: pointer;
  }
  .frame:hover .x { display: block; }

  /* ---------- Hero / preview ---------- */
  .hero { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 760px) { .hero { grid-template-columns: 300px 1fr; } }
  .shot { position: relative; border-radius: 16px; overflow: hidden; background:
      radial-gradient(circle at 30% 20%, rgba(99,102,241,.25), transparent 55%),
      linear-gradient(160deg, #131a2c, #0a0f1d); }
  .shot img { width: 100%; height: 240px; object-fit: contain; display: block; }
  @media (min-width: 760px) { .shot img { height: 270px; } }
  .shot .fmt-badge {
    position: absolute; top: 12px; left: 12px;
    font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    padding: 4px 10px; border-radius: 99px;
    background: var(--grad); color: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 480px) { .stats { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1000px) { .stats { grid-template-columns: repeat(3, 1fr); } }
  .stat {
    background: var(--glass-2);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .stat .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .9px; margin-bottom: 4px; }
  .stat .v { font-size: 15px; font-weight: 700; font-family: var(--mono); word-break: break-word; }
  .stat .v small { font-size: 11px; color: var(--faint); font-weight: 500; }

  /* ---------- GPS ---------- */
  .gps-card {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    background: linear-gradient(135deg, rgba(16,185,129,.12), rgba(6,182,212,.1));
    border: 1px solid rgba(16,185,129,.28);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .gps-card .coords { font-family: var(--mono); font-size: 15px; font-weight: 700; color: #a7f3d0; }
  .gps-card .links { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .gps-card a, .gps-card .copybtn {
    color: #d1fae5; font-size: 12.5px; font-weight: 600;
    border: 1px solid rgba(16,185,129,.4); border-radius: 9px;
    padding: 6px 12px; background: rgba(16,185,129,.12);
    cursor: pointer; transition: background .15s;
  }
  .gps-card a:hover, .gps-card .copybtn:hover { background: rgba(16,185,129,.24); }

  /* ---------- Metadata tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .tile {
    background: var(--glass-2);
    border: 1px solid var(--stroke);
    border-radius: 12px;
    padding: 11px 13px;
  }
  .tile .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
  .tile .val { font-size: 12.8px; font-family: var(--mono); word-break: break-word; color: #dbe4f0; }

  .sect { margin-bottom: 8px; }
  .sect-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase;
    padding: 14px 4px 10px;
  }
  .sect-head .n {
    font-size: 10px; background: var(--grad-soft); border: 1px solid rgba(139,92,246,.3);
    color: #c4b5fd; padding: 1px 7px; border-radius: 99px;
  }

  details { background: var(--glass-2); border: 1px solid var(--stroke); border-radius: 12px; padding: 12px 15px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; }
  pre { margin: 12px 0 0; max-height: 380px; overflow: auto; font-size: 12px; color: #c7d2fe; white-space: pre-wrap; word-break: break-word; }

  /* ---------- Forms ---------- */
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 10.5px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .8px; }
  .field label b { color: var(--text); font-weight: 700; }
  .field input {
    width: 100%;
    background: var(--glass-2);
    border: 1px solid var(--stroke);
    color: var(--text);
    border-radius: 11px;
    padding: 10px 13px;
    font-size: 13.5px;
    font-family: var(--mono);
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--indigo); }
  .field-row { display: grid; grid-template-columns: 1fr; gap: 0; }
  @media (min-width: 640px) { .field-row { grid-template-columns: 1fr 1fr; column-gap: 14px; } }
  .check { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--text); margin: 15px 0; cursor: pointer; }
  .check input { width: auto; accent-color: var(--indigo); }

  .notice {
    border-radius: 13px; padding: 13px 16px; font-size: 13px; margin-bottom: 15px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .notice.info { background: rgba(99,102,241,.1); border: 1px solid rgba(99,102,241,.3); color: #c7d2fe; }
  .notice.warn { background: rgba(251,191,36,.09); border: 1px solid rgba(251,191,36,.3); color: #fde9c8; }
  .notice.ok { background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.3); color: #c8f5e0; }

  .tag-list { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .tag { background: rgba(248,113,113,.13); border: 1px solid rgba(248,113,113,.4); color: #fca5a5; border-radius: 99px; padding: 4px 12px; font-size: 12px; font-family: var(--mono); }

  /* ---------- Toast ---------- */
  .toast-wrap { position: fixed; bottom: calc(96px + var(--safe-bottom)); right: 18px; z-index: 60; display: flex; flex-direction: column; gap: 8px; max-width: min(360px, calc(100vw - 36px)); }
  @media (min-width: 901px) { .toast-wrap { bottom: 22px; } }
  .toast {
    background: rgba(15,20,32,.92);
    border: 1px solid var(--stroke);
    border-left: 3px solid var(--indigo);
    backdrop-filter: blur(16px);
    border-radius: 12px;
    padding: 12px 15px;
    font-size: 13px;
    box-shadow: 0 14px 40px rgba(0,0,0,.45);
    animation: slideIn .25s ease both;
  }
  .toast.err { border-left-color: var(--red); }
  .toast.ok { border-left-color: var(--green); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

  /* ---------- Skeleton ---------- */
  .skel { position: relative; overflow: hidden; background: var(--glass-2); border-radius: 14px; }
  .skel::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
    transform: translateX(-100%);
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { to { transform: translateX(100%); } }

  .loading-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .skeletons { padding: 4px 0; }
  .skeletons .skel { height: 64px; margin-bottom: 10px; }

  .empty { text-align: center; color: var(--muted); padding: 56px 16px; }
  .empty .big { font-size: 44px; margin-bottom: 12px; opacity: .75; }
  .empty .t { font-size: 15px; color: var(--text); font-weight: 600; margin-bottom: 4px; }

  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .spinner {
    width: 15px; height: 15px; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .mono { font-family: var(--mono); }
</style>
</head>
<body>
<div class="bgfx"></div>

<header>
  <div class="header-in">
    <div class="brand">
      <div class="logo">E</div>
      <div>
        <div class="title">exif-mcp</div>
        <div class="sub">Image Metadata Lab</div>
      </div>
    </div>
    <div class="right">
      <div class="pill on" id="statusPill"><span class="dot"></span><span id="statusText">Server connected</span></div>
    </div>
  </div>
</header>

<nav class="desktop-nav" id="desktopNav">
  <button class="nav-btn active" data-view="analyze" id="nav-analyze">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    Analyze
  </button>
  <button class="nav-btn" data-view="edit" id="nav-edit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
    Edit
  </button>
  <button class="nav-btn" data-view="clean" id="nav-clean">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
    Clean
  </button>
</nav>

<div class="app">
  <div class="content">
    <!-- Source card -->
    <div class="card" style="animation:none">
      <div class="card-h">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
        Images <span class="ln"></span>
      </div>
      <div class="dropzone" id="dropzone">
        <div class="dz-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        </div>
        <div class="big">Drop images anywhere</div>
        <div class="hint">or click to browse — batch supported · JPEG, PNG, TIFF, HEIC</div>
        <input type="file" id="fileInput" accept="image/*,.heic,.heif,.tif,.tiff" multiple>
      </div>
      <div class="url-row">
        <input type="text" id="urlInput" placeholder="…or paste an image URL (http / https)" autocomplete="off">
        <button class="btn ghost" id="urlBtn">Load</button>
      </div>
      <div class="filmstrip" id="filmstrip"></div>
    </div>

    <div id="view-analyze"></div>
    <div id="view-edit" class="hidden"></div>
    <div id="view-clean" class="hidden"></div>
  </div>
</div>

<nav class="mobile-nav" id="mobileNav">
  <button class="nav-btn active" data-view="analyze">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    Analyze
  </button>
  <button class="nav-btn" data-view="edit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
    Edit
  </button>
  <button class="nav-btn" data-view="clean">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
    Clean
  </button>
</nav>

<div class="toast-wrap" id="toasts"></div>

<script>
'use strict';

const MAX_BYTES = 30 * 1024 * 1024;
const state = { images: [], selectedId: null, view: 'analyze' };

const $ = id => document.getElementById(id);
const dropzone = $('dropzone'), fileInput = $('fileInput'), urlInput = $('urlInput'), urlBtn = $('urlBtn');
const filmstrip = $('filmstrip');
const viewAnalyze = $('view-analyze'), viewEdit = $('view-edit'), viewClean = $('view-clean');

const GROUPS = {
  Camera: ['Make', 'Model', 'Software', 'Artist', 'Copyright', 'LensModel', 'SerialNumber', 'OwnerName', 'ImageDescription', 'UserComment'],
  Exposure: ['ExposureTime', 'FNumber', 'ISO', 'FocalLength', 'FocalLengthIn35mmFormat', 'ExposureProgram', 'ExposureCompensation', 'Flash', 'MeteringMode', 'WhiteBalance', 'ShutterSpeedValue', 'ApertureValue'],
  Image: ['ExifImageWidth', 'ExifImageHeight', 'Orientation', 'ColorSpace', 'ResolutionUnit', 'XResolution', 'YResolution', 'YCbCrPositioning'],
  Date: ['DateTime', 'DateTimeOriginal', 'DateTimeDigitized', 'CreateDate', 'ModifyDate'],
  GPS: ['GPSLatitudeRef', 'GPSLatitude', 'GPSLongitudeRef', 'GPSLongitude', 'GPSAltitude', 'GPSTimeStamp', 'GPSDateStamp', 'GPSVersionID'],
};
const GROUP_ICONS = { Camera: '📷', Exposure: '⚙️', Image: '🖼', Date: '🕒', GPS: '📍', Other: '🗂' };

/* ---------------- API ---------------- */

async function api(url, payload) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || 'Request failed');
  return data;
}

/* ---------------- Toast ---------------- */

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), 5200);
}

/* ---------------- Source / files ---------------- */

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('dragover');
  for (const f of [...e.dataTransfer.files].slice(0, 20)) handleFile(f);
});
fileInput.addEventListener('change', () => { for (const f of [...fileInput.files].slice(0, 20)) handleFile(f); fileInput.value = ''; });
urlBtn.addEventListener('click', loadUrl);
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadUrl(); });

function handleFile(file) {
  if (file.size > MAX_BYTES) { toast(file.name + ' is too large (max 30MB).', 'err'); return; }
  const reader = new FileReader();
  reader.onload = () => addImage({ kind: 'base64', data: reader.result }, file.name);
  reader.onerror = () => toast('Could not read ' + file.name, 'err');
  reader.readAsDataURL(file);
}

function loadUrl() {
  const url = urlInput.value.trim();
  if (!url) return;
  urlInput.value = '';
  addImage({ kind: 'url', url }, 'remote-' + (Date.now() % 10000) + '.jpg');
}

async function addImage(source, name) {
  urlBtn.disabled = true;
  showLoading();
  try {
    const result = await api('/api/analyze', { image: source });
    const img = { id: 'img-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), name, source, dataUrl: source.data || null, meta: result };
    state.images.push(img);
    state.selectedId = img.id;
    renderFilmstrip();
    setView('analyze');
  } catch (e) {
    toast('Failed to analyze ' + name + ': ' + e.message, 'err');
    renderCurrent();
  }
  urlBtn.disabled = false;
}

function removeImage(id) {
  const idx = state.images.findIndex(i => i.id === id);
  if (idx === -1) return;
  state.images.splice(idx, 1);
  if (state.selectedId === id) state.selectedId = (state.images[idx] || state.images[idx - 1] || null)?.id ?? null;
  renderFilmstrip(); renderCurrent();
}

function current() { return state.images.find(i => i.id === state.selectedId) || null; }

/* ---------------- Nav ---------------- */

function setView(v) {
  state.view = v;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  renderCurrent();
}
document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

/* ---------------- Rendering ---------------- */

function showLoading() {
  const rows = [1, 2, 3, 4, 5, 6, 7, 8].map(() => '<div class="skel"></div>').join('');
  viewAnalyze.innerHTML = '<div class="card"><div class="card-h">Reading metadata <span class="ln"></span></div><div class="skeletons">' + rows + '</div></div>';
  viewAnalyze.classList.remove('hidden');
  viewEdit.classList.add('hidden');
  viewClean.classList.add('hidden');
}

function renderCurrent() {
  const img = current();
  if (!img) {
    viewAnalyze.innerHTML = '<div class="card"><div class="empty"><div class="big">🖼️</div><div class="t">No image yet</div>Drop an image above — or paste a URL — to see its metadata.</div></div>';
    viewEdit.innerHTML = ''; viewClean.innerHTML = '';
    viewAnalyze.classList.remove('hidden'); viewEdit.classList.add('hidden'); viewClean.classList.add('hidden');
    return;
  }
  viewAnalyze.classList.toggle('hidden', state.view !== 'analyze');
  viewEdit.classList.toggle('hidden', state.view !== 'edit');
  viewClean.classList.toggle('hidden', state.view !== 'clean');
  if (state.view === 'analyze') renderAnalyze(img);
  else if (state.view === 'edit') renderEdit(img);
  else renderClean(img);
}

function renderFilmstrip() {
  filmstrip.innerHTML = state.images.map(i => {
    const src = i.dataUrl || i.meta.thumbnailDataUrl || '';
    const fmt = (i.meta.info && i.meta.info.format) || 'img';
    const sel = i.id === state.selectedId ? 'sel' : '';
    return '<div class="frame ' + sel + '" data-id="' + i.id + '">' +
      (src ? '<img src="' + src + '" alt="">' : '<div style="height:100%;display:grid;place-items:center;font-size:22px">🖼</div>') +
      '<button class="x" data-remove="' + i.id + '" title="Remove">✕</button>' +
      '<span class="badge">' + fmt + '</span></div>';
  }).join('');
}

filmstrip.addEventListener('click', e => {
  const rem = e.target.closest('[data-remove]');
  if (rem) { e.stopPropagation(); removeImage(rem.dataset.remove); return; }
  const frame = e.target.closest('.frame');
  if (frame) { state.selectedId = frame.dataset.id; renderFilmstrip(); renderCurrent(); }
});

/* ---------------- Helpers ---------------- */

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmt(v) {
  if (v === null || v === undefined || v === '') return '—';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'object') { try { return JSON.stringify(v); } catch { return String(v); } }
  return String(v);
}
function sizeTxt(n) {
  if (!n) return '';
  if (n > 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n > 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}
function shutter(t) {
  if (typeof t !== 'number' || !isFinite(t)) return t == null ? '' : String(t);
  if (t >= 1) return t + 's';
  return '1/' + Math.round(1 / t) + 's';
}
function dlDataUrl(dataUrl, name) { const a = document.createElement('a'); a.href = dataUrl; a.download = name; a.click(); }
function jsonUrl(obj) { return 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(obj, null, 2)); }
function toExifDate(v) {
  if (!/^\d{4}-\d{2}-\d{2}/.test(v)) return v;
  const d = new Date(v); if (isNaN(d.getTime())) return v;
  const p = n => String(n).padStart(2, '0');
  return d.getUTCFullYear() + ':' + p(d.getUTCMonth() + 1) + ':' + p(d.getUTCDate()) + ' ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds());
}

function stat(l, v) { return '<div class="stat"><div class="l">' + l + '</div><div class="v">' + (v || '—') + '</div></div>'; }

/* ---------------- Analyze ---------------- */

function renderAnalyze(img) {
  const m = img.meta.metadata || {};
  const gps = img.meta.gps;
  const info = img.meta.info || {};
  const dims = (info.width ? info.width + ' × ' + info.height + ' px' : (m.ExifImageWidth ? m.ExifImageWidth + ' × ' + m.ExifImageHeight + ' px' : ''));

  let html = '<div class="card"><div class="hero">';

  html += '<div class="shot">';
  html += img.dataUrl ? '<img src="' + img.dataUrl + '">' : '<img src="' + (img.meta.thumbnailDataUrl || '') + '" style="height:240px">';
  html += '<span class="fmt-badge">' + (info.format || 'image') + '</span>';
  html += '</div>';

  html += '<div>';
  html += '<div class="stats">';
  html += stat('Camera', (m.Make ? m.Make + (m.Model ? ' ' : '') : '') + (m.Model || ''));
  html += stat('Date taken', fmt(m.DateTimeOriginal || m.ModifyDate || m.CreateDate || ''));
  html += stat('Dimensions', dims);
  html += stat('Shutter', shutter(m.ExposureTime));
  html += stat('Aperture', m.FNumber ? 'f/' + m.FNumber : '');
  html += stat('ISO', fmt(m.ISO));
  html += stat('Focal', m.FocalLength ? m.FocalLength + ' mm' : '');
  html += stat('Orientation', img.meta.orientation ?? '');
  html += stat('File size', sizeTxt(info.size));
  html += '</div>';

  if (gps && gps.latitude !== undefined && gps.longitude !== undefined) {
    const lat = gps.latitude, lon = gps.longitude;
    const osm = 'https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lon + '#map=14/' + lat + '/' + lon;
    const gm = 'https://maps.google.com/maps?q=' + lat + ',' + lon;
    html += '<div class="gps-card" style="margin-top:14px">';
    html += '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#34d399" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
    html += '<span class="coords">' + lat.toFixed(5) + ', ' + lon.toFixed(5) + '</span>';
    html += '<span class="links"><button class="copybtn" data-copy="' + lat + ',' + lon + '">Copy</button>';
    html += '<a href="' + osm + '" target="_blank" rel="noopener">OpenStreetMap ↗</a>';
    html += '<a href="' + gm + '" target="_blank" rel="noopener">Google Maps ↗</a></span>';
    html += '</div>';
  } else {
    html += '<div class="notice info" style="margin-top:14px">No GPS coordinates in this image.</div>';
  }

  html += '<div class="row-actions">';
  html += '<button class="btn ghost" data-dl="' + jsonUrl(img.meta) + '">⬇ Metadata JSON</button>';
  html += '<button class="btn ghost" data-view-switch="edit">✏️ Edit EXIF</button>';
  html += '<button class="btn ghost" data-view-switch="clean">🧹 Strip</button>';
  html += '</div>';
  html += '</div></div></div>';

  if (m && Object.keys(m).length) {
    const grouped = [];
    for (const [group, keys] of Object.entries(GROUPS)) {
      const tiles = keys.filter(k => m[k] !== undefined && m[k] !== null).map(k =>
        '<div class="tile"><div class="k">' + k + '</div><div class="val">' + (typeof m[k] === 'object' && m[k] !== null ? esc(JSON.stringify(m[k])) : esc(fmt(m[k]))) + '</div></div>').join('');
      if (tiles) grouped.push('<div class="sect"><div class="sect-head">' + GROUP_ICONS[group] + ' ' + group + ' <span class="n">' + tiles.split('tile').length - 1 + '</span></div><div class="tiles">' + tiles + '</div></div>');
    }
    const rest = Object.keys(m).filter(k => !Object.values(GROUPS).flat().includes(k)).map(k =>
      '<div class="tile"><div class="k">' + k + '</div><div class="val">' + (typeof m[k] === 'object' && m[k] !== null ? esc(JSON.stringify(m[k])) : esc(fmt(m[k]))) + '</div></div>').join('');
    if (rest) grouped.push('<div class="sect"><div class="sect-head">🗂 Other <span class="n">' + Object.keys(m).filter(k => !Object.values(GROUPS).flat().includes(k)).length + '</span></div><div class="tiles">' + rest + '</div></div>');

    html += '<div class="card"><div class="card-h">Metadata <span class="ln"></span></div>' + grouped.join('') + '</div>';
  } else {
    html += '<div class="card"><div class="card-h">Metadata <span class="ln"></span></div><div class="notice warn">No metadata found in this image.</div></div>';
  }

  html += '<div class="card"><div class="card-h">Raw JSON <span class="ln"></span></div><details><summary>Show full JSON output</summary><pre>' + esc(JSON.stringify(img.meta, null, 2)) + '</pre></details></div>';

  viewAnalyze.innerHTML = html;
}

viewAnalyze.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c) {
    navigator.clipboard && navigator.clipboard.writeText(c.dataset.copy);
    c.textContent = 'Copied ✓';
    setTimeout(() => (c.textContent = 'Copy'), 1500);
    return;
  }
  const dl = e.target.closest('[data-dl]');
  if (dl) { const a = document.createElement('a'); a.href = dl.dataset.dl; a.download = (current().name || 'image').replace(/\.[^.]+$/, '') + '.metadata.json'; a.click(); return; }
  const sw = e.target.closest('[data-view-switch]');
  if (sw) setView(sw.dataset.viewSwitch);
});

/* ---------------- Edit ---------------- */

const FIELD_DEFS = [
  ['Make', 'Camera make'], ['Model', 'Camera model'], ['Software', 'Software'],
  ['ImageDescription', 'Description'], ['Artist', 'Artist'], ['Copyright', 'Copyright'],
  ['UserComment', 'User comment'], ['DateTime', 'Date modified'],
  ['DateTimeOriginal', 'Date taken'], ['DateTimeDigitized', 'Date digitized'],
];

function renderEdit(img) {
  const m = img.meta.metadata || {};
  const gps = img.meta.gps || {};
  let html = '<div class="card"><div class="card-h">Edit EXIF <span class="ln"></span></div>';
  html += '<div class="notice warn">Only JPEG is editable. A new EXIF block is written into a <b>copy</b> — your original file is never modified.</div>';
  html += '<div class="field-row">';
  FIELD_DEFS.forEach(([key, label], i) => {
    html += '<div class="field"><label>' + label + ' &middot; <b>' + key + '</b></label><input data-field="' + key + '" value="' + esc(m[key] ?? '') + '" spellcheck="false"></div>';
    if (i % 2 === 1) html += '</div><div class="field-row">';
  });
  html += '</div>';
  html += '<div class="sect-head" style="padding-top:4px">📍 GPS</div><div class="field-row">';
  html += '<div class="field"><label>Latitude</label><input data-field="lat" type="number" step="any" value="' + (gps.latitude ?? '') + '" placeholder="e.g. 40.7128"></div>';
  html += '<div class="field"><label>Longitude</label><input data-field="lon" type="number" step="any" value="' + (gps.longitude ?? '') + '" placeholder="e.g. -74.0060"></div>';
  html += '</div>';
  html += '<label class="check"><input type="checkbox" id="clearGps"> Remove all GPS coordinates</label>';
  html += '<div class="row-actions"><button class="btn success" id="saveEdit">💾 Save &amp; Download</button></div>';
  html += '</div>';
  viewEdit.innerHTML = html;
}

async function saveEdit() {
  const img = current(); if (!img) return;
  const fields = {};
  FIELD_DEFS.forEach(([key]) => {
    const val = viewEdit.querySelector('[data-field="' + key + '"]').value.trim();
    if (val !== '') fields[key] = key.startsWith('DateTime') ? toExifDate(val) : val;
  });
  const changes = { fields };
  const lat = parseFloat(viewEdit.querySelector('[data-field="lat"]').value);
  const lon = parseFloat(viewEdit.querySelector('[data-field="lon"]').value);
  if ($('clearGps').checked) changes.clearGps = true;
  else if (Number.isFinite(lat) && Number.isFinite(lon)) changes.gps = { latitude: lat, longitude: lon };

  const btn = $('saveEdit'); btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';
  try {
    const result = await api('/api/edit', { image: img.source, ...changes });
    const fname = (img.name || 'image').replace(/\.[^.]+$/, '') + '-edited.jpg';
    viewEdit.innerHTML = '<div class="notice ok">Saved — changed: <b>' + result.changed.join(', ') + '</b></div>' +
      '<div class="card"><div class="card-h">Edited preview <span class="ln"></span></div>' +
      '<div class="hero"><div class="shot"><img src="' + result.dataUrl + '"><span class="fmt-badge">jpeg</span></div>' +
      '<div><div class="stats">' + stat('File', fname) + stat('Size', sizeTxt(atob(result.dataUrl.split(',')[1]).length)) + stat('Changed', result.changed.join(', ')) + '</div>' +
      '<div class="row-actions"><button class="btn success" id="dlEdited">⬇ Download edited image</button>' +
      '<button class="btn ghost" id="backEdit">↩ Back to form</button></div></div></div></div>';
    $('dlEdited').addEventListener('click', () => dlDataUrl(result.dataUrl, fname));
    $('backEdit').addEventListener('click', () => renderEdit(current()));
  } catch (e) {
    toast('Edit failed: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = '💾 Save & Download';
  }
}

viewEdit.addEventListener('click', e => { if (e.target.closest('#saveEdit')) saveEdit(); });

/* ---------------- Clean ---------------- */

function renderClean(img) {
  let html = '<div class="card"><div class="card-h">Strip all metadata <span class="ln"></span></div>';
  html += '<div class="notice warn">Removes <b>all</b> metadata — EXIF, GPS, XMP, ICC, IPTC — losslessly. Only metadata segments are removed, pixels are untouched. Supported: JPEG &amp; PNG.</div>';
  html += '<div class="row-actions"><button class="btn danger" id="doStrip">🧹 Remove all metadata — one click</button></div>';
  html += '<div id="stripResult"></div></div>';
  viewClean.innerHTML = html;
}

async function doStrip() {
  const img = current(); if (!img) return;
  const btn = $('doStrip'); btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Stripping…';
  try {
    const result = await api('/api/strip', { image: img.source });
    const ext = result.mime === 'image/png' ? 'png' : 'jpg';
    const fname = (img.name || 'image').replace(/\.[^.]+$/, '') + '-cleaned.' + ext;
    let html = '<div class="notice ok">Metadata removed — ' + sizeTxt(result.sizeBefore) + ' → ' + sizeTxt(result.sizeAfter) + ' (' + Math.round(100 * result.sizeAfter / result.sizeBefore) + '% of original)</div>';
    if (result.removed.length) html += '<div class="tag-list"><span style="font-size:12px;color:var(--muted);align-self:center">Removed:</span>' + result.removed.map(r => '<span class="tag">' + r + '</span>').join('') + '</div>';
    else html += '<div class="notice info">No removable metadata found — this image was already clean.</div>';
    html += '<div class="hero" style="margin-top:14px"><div class="shot"><img src="' + result.dataUrl + '"><span class="fmt-badge">clean</span></div>' +
      '<div><div class="stats">' + stat('New size', sizeTxt(result.sizeAfter)) + stat('Saved', sizeTxt(result.sizeBefore - result.sizeAfter)) + stat('Segments', result.removed.join(', ') || '—') + '</div>' +
      '<div class="row-actions"><button class="btn danger" id="dlStripped">⬇ Download cleaned image</button></div></div></div>';
    $('stripResult').innerHTML = html;
    $('dlStripped').addEventListener('click', () => dlDataUrl(result.dataUrl, fname));
  } catch (e) {
    toast('Strip failed: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = '🧹 Remove all metadata — one click';
  }
}

viewClean.addEventListener('click', e => { if (e.target.closest('#doStrip')) doStrip(); });

/* ---------------- Init ---------------- */

fetch('/api/health').then(r => {
  if (r.ok) { $('statusPill').classList.add('on'); $('statusText').textContent = 'Server connected'; }
}).catch(() => { $('statusPill').classList.remove('on'); $('statusText').textContent = 'Server offline'; });

renderCurrent();
</script>
</body>
</html>
